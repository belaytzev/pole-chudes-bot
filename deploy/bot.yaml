apiVersion: v1
kind: Namespace
metadata:
  name: pole-chudes-bot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: pole-chudes-bot
spec:
  storageClassName: longhorn-ha
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pole-chudes-bot
  namespace: pole-chudes-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pole-chudes-bot
  template:
    metadata:
      labels:
        app: pole-chudes-bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: ghcr.io/belaytzev/pole-chudes-bot:0.1.0
          env:
            - name: TZ
              value: Europe/Moscow
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
